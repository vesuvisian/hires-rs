name: Documentation

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WebGPU wasm
        run: |
          wasm-pack build web --release --target web --out-dir "$PWD/docs/app/pkg-wgpu" \
            -- --no-default-features --features wgpu

      - name: Build Flex wasm
        run: |
          wasm-pack build web --release --target web --out-dir "$PWD/docs/app/pkg-flex" \
            -- --no-default-features --features flex

      - name: Stage iframe app and weights
        run: bash web/stage.sh

      - name: Check model weights
        run: |
          det=docs/app/weights/detection/best.bpk
          seg=docs/app/weights/segmentation/efficientnet-b2_best.bpk
          if [[ ! -f "$det" || ! -f "$seg" ]]; then
            echo "::error::Burnpack weights missing. Commit weights/*.bpk (each under 100MB) or download them into docs/app/weights/ from a GitHub Release before zensical build."
            exit 1
          fi
          python3 - <<'PY'
          import os
          for p in [
              "docs/app/weights/detection/best.bpk",
              "docs/app/weights/segmentation/efficientnet-b2_best.bpk",
          ]:
              n = os.path.getsize(p)
              print(f"{p}: {n / 1e6:.1f} MB")
              if n >= 100 * 1024 * 1024:
                  raise SystemExit(
                      f"{p} is >= 100MB; Git cannot store it. Host it on a GitHub Release and copy it into docs/app/weights/ in CI."
                  )
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Build documentation site
        run: zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
