[package]
name = "hires"
version = "0.1.0"
edition = "2024"
description = "GStreamer plugin for HiRes resistor value detection"
repository.workspace = true
license = "MIT"

[dependencies]
gst = { package = "gstreamer", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main" }
gst-base = { package = "gstreamer-base", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main" }
gst-video = { package = "gstreamer-video", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main" }
hires-rs = { path = "../..", default-features = false }
image = { version = "0.25", default-features = false }
smart-default = "0.7.1"
bytes = "1"
burn = { version = "0.22.0-pre.4", default-features = false, features = ["std"] }

[build-dependencies]
gst-plugin-version-helper = { path = "../version-helper" }

[features]
default = ["wgpu"]
wgpu = ["hires-rs/wgpu"]
flex = ["hires-rs/flex"]
metal = ["hires-rs/metal"]
cuda = ["hires-rs/cuda"]
static = []
capi = []

[lib]
name = "gsthires"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
