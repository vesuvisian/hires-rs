<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HiRes</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div id="app">
      <p id="status">Loading…</p>
      <div class="toolbar">
        <label>
          Upload
          <input id="file" type="file" accept="image/*" />
        </label>
        <label class="check">
          <input id="bands" type="checkbox" />
          Band overlay
        </label>
        <label class="conf">
          Conf
          <input
            id="conf"
            type="range"
            min="1"
            max="20"
            step="1"
            value="10"
          />
          <span id="conf-val">0.010</span>
        </label>
      </div>
      <div class="examples" aria-label="Example images">
        <span class="examples-label">Try</span>
        <button type="button" class="example" data-src="./examples/4band-10ohm.jpg" title="4-band 10 Ω">
          <img src="./examples/4band-10ohm.jpg" alt="" width="64" height="36" />
          <span>10 Ω</span>
        </button>
        <button type="button" class="example" data-src="./examples/4band-1kohm.jpg" title="4-band 1 kΩ">
          <img src="./examples/4band-1kohm.jpg" alt="" width="64" height="36" />
          <span>1 kΩ</span>
        </button>
        <button type="button" class="example" data-src="./examples/5band-22ohm.jpg" title="5-band 22 Ω">
          <img src="./examples/5band-22ohm.jpg" alt="" width="64" height="36" />
          <span>22 Ω</span>
        </button>
      </div>
      <div id="drop" class="drop">
        <canvas id="view"></canvas>
        <p id="hint">Drop an image, use Upload, or try an example.</p>
      </div>
      <p id="meta"></p>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
